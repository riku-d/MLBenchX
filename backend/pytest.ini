[pytest]
testpaths = tests
addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    slow: takes more than a few seconds (sandbox attacks, performance budgets)
    perf: asserts a timing budget; excluded from coverage runs on slow machines
filterwarnings =
    ignore::DeprecationWarning:starlette.*
