[pytest]
testpaths = tests
addopts =
    --strict-markers
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-fail-under=80
markers =
    slow: takes more than a few seconds (sandbox attacks, performance budgets)
    perf: asserts a timing budget; excluded from coverage runs on slow machines
filterwarnings =
    ignore::DeprecationWarning:starlette.*
    # The sanity baseline fits a LogisticRegression on whatever the user's pipeline
    # produced. On deliberately signal-free fixtures lbfgs cannot converge, which is
    # the correct outcome and is reported as "no better than guessing" — not a defect
    # to be fixed by raising max_iter.
    ignore::sklearn.exceptions.ConvergenceWarning
